
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="theme-color" content="#101c25">
<title>NexusBlatter 3D - Anime Battle Royale</
<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;
 overflow:hidden;
 font-family:Arial,sans-serif;
 background:#101c25;
 color:white;
 touch-action:none;
}
#game{
 position:fixed;inset:0;
 z-index:0;
}
#game canvas{
 width:100%;height:100%;
 display:block;
 touch-action:none;
}
#hud{
 position:fixed;top:10px;left:10px;right:10px;
 z-index:3;display:none;
 pointer-events:none;
}
#topo{
 display:flex;justify-content:space-between;
 gap:5px;flex-wrap:wrap;
}
.painel{
 background:#071726dd;
 border:1px solid #38bdf8;
 border-radius:9px;
 padding:8px;
 font-size:12px;
 font-weight:bold;
}
#barraFundo{
 width:105px;height:9px;
 background:#333;border-radius:10px;
 overflow:hidden;margin-top:5px;
}
#barraVida{
 width:100%;height:100%;
 background:#36e66a;
}
#ajuda{margin-top:7px;display:inline-block}
#minimapa{
 position:fixed;right:10px;top:90px;
 width:105px;height:105px;
 z-index:4;border:2px solid #38bdf8;
 border-radius:10px;display:none;
}
#miraVisual{
 position:fixed;left:50%;top:50%;
 transform:translate(-50%,-50%);
 width:25px;height:25px;z-index:2;
 display:none;pointer-events:none;
}
#miraVisual:before,.mira2{
 content:"";position:absolute;background:white;
}
#miraVisual:before{
 width:2px;height:25px;left:11px;
}
.mira2{
 width:25px;height:2px;top:11px;
}
#controles{
 position:fixed;bottom:18px;left:0;right:0;
 z-index:5;display:none;
 align-items:flex-end;justify-content:space-between;
 padding:0 15px;
 pointer-events:none;
}
#joystick{
 width:110px;height:110px;
 border-radius:50%;
 background:#142a3abf;
 border:2px solid #69cfff;
 position:relative;pointer-events:auto;
 touch-action:none;
}
#pino{
 position:absolute;width:38px;height:38px;
 border-radius:50%;background:#4bcaff;
 border:2px solid white;
 left:34px;top:34px;
}
.botoes{
 display:flex;flex-direction:column;
 align-items:flex-end;gap:8px;
 pointer-events:auto;
}
.linha{display:flex;gap:7px}
.btn{
 border:1px solid #83dcff;
 color:white;
 background:#123e60e8;
 border-radius:12px;
 font-weight:bold;
 padding:12px 10px;
 min-width:68px;
 font-size:11px;
 touch-action:none;
}
.btn:active{background:#087ec0}
#btnAtaque{
 background:#087eaa;
 min-width:82px;
}
#mensagem{
 position:fixed;inset:0;z-index:10;
 display:flex;align-items:center;
 justify-content:center;
 padding:15px;
 background:linear-gradient(135deg,#071426ed,#102b45ed);
}
#caixa{
 width:min(100%,440px);
 max-height:94vh;overflow:auto;
 text-align:center;
 padding:22px 15px;
 border:2px solid #25bfff;
 border-radius:20px;
 background:linear-gradient(145deg,#102b45,#071321);
 box-shadow:0 0 25px #008dff55;
}
h1{
 color:#49ceff;
 font-size:27px;
 margin:5px 0;
}
.subtitulo{
 color:#d7efff;
 font-weight:bold;
 letter-spacing:2px;
}
#listaHerois{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;margin:15px 0;
}
.heroi{
 min-height:65px;
 border:1px solid #397b9e;
 border-radius:10px;
 color:white;background:#142c42;
 font-weight:bold;
 padding:9px 4px;
}
.heroi small{
 display:block;color:#9ddfff;
 margin-top:5px;font-weight:normal;
}
.heroi.selecionado{
 border:2px solid #36e9ff;
 background:#07537b;
 box-shadow:0 0 12px #00bfff88;
}
#descricao{color:#c6eaff;font-size:13px}
#jogar{
 width:100%;padding:15px;
 border:0;border-radius:12px;
 color:white;background:linear-gradient(90deg,#087ec0,#00b9d6);
 font-size:17px;font-weight:bold;
 margin-top:10px;
}
#aviso{
 display:none;position:fixed;
 top:40%;left:50%;
 transform:translate(-50%,-50%);
 z-index:8;background:#071b2cee;
 padding:13px 20px;border-radius:12px;
 border:1px solid #42d5ff;
 font-weight:bold;text-align:center;
}
@media(max-height:600px){
 #joystick{width:85px;height:85px}
 #pino{left:25px;top:25px}
 #caixa{padding:12px}
 .heroi{min-height:48px}
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
 <div id="topo">
  <div class="painel">
   ❤️ VIDA
   <div id="barraFundo">
    <div id="barraVida"></div>

 <div class="botoes">

<div id="mensagem">
 <div id="caixa">
  <h1>NEXUSBLATTER 3D</h1>

  <p>ESCOLHA SEU PERSONAGEM</p>

  <div id="listaHerois">
   <button class="heroi selecionado" data-heroi="Naruto">🍥 NARUTO<small>Rasengan</small></button>
   <button class="heroi" data-heroi="Sasuke">⚡ SASUKE<small>Chidori</small></button>
   <button class="heroi" data-heroi="Nami">🌊 NAMI<small>Tempestade</small></button>
   <button class="heroi" data-heroi="Zoro">⚔️ ZORO<small>Corte triplo</small></button>
   <button class="heroi" data-heroi="Luffy">👒 LUFFY<small>Golpe elástico</small></button>
   <button class="heroi" data-heroi="Goku">🔥 GOKU<small>Energia</small></button>
   <button class="heroi" data-heroi="Vegeta">💥 VEGETA<small>Explosão</small></button>
   <button class="heroi" data-heroi="Tanjiro">☀️ TANJIRO<small>Energia solar</small></button>
   <button class="heroi" data-heroi="Nezuko">🌸 NEZUKO<small>Poder especial</small></button>
   <button class="heroi" data-heroi="Ichigo">🗡️ ICHIGO<small>Energia espiritual</small></button>
  </div>

  <button id="jogar">ENTRAR NO JOGO</button>
 </div>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

/* CONFIGURAÇÃO */

const $=id=>document.getElementById(id);

const game=$("game");
const cena=new THREE.Scene();
cena.background=new THREE.Color(0x91c9e8);
cena.fog=new THREE.Fog(0x91c9e8,55,145);

const camera=new THREE.PerspectiveCamera(
 65,innerWidth/innerHeight,.1,250
);

const renderer=new THREE.WebGLRenderer({
 antialias:true,alpha:false
});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1;
game.appendChild(renderer.domElement);

cena.add(new THREE.HemisphereLight(0xdaf3ff,0x52613b,2));

const sol=new THREE.DirectionalLight(0xffffff,2);
sol.position.set(-25,45,20);
sol.castShadow=true;
sol.shadow.mapSize.set(1024,1024);
cena.add(sol);

const material=(cor,extra={})=>
 new THREE.MeshStandardMaterial({
  color:cor,roughness:.8,...extra
});

/* MAPA */

const verde=material(0x438b43);
const tronco=material(0x70452b);
const folhas=material(0x207d45);
const parede=material(0xd1b68b);
const telhado=material(0x87483d);

function adicionar(geo,m,x,y,z){
 const o=new THREE.Mesh(geo,m);
 o.position.set(x,y,z);
 o.castShadow=true;
 o.receiveShadow=true;
 cena.add(o);
 return o;
}

adicionar(
 new THREE.PlaneGeometry(180,180),
 verde,0,0,0
).rotation.x=-Math.PI/2;

const grade=new THREE.GridHelper(
 180,45,0x315f36,0x57844a
);
grade.position.y=.025;
cena.add(grade);

function caixa(w,h,d,m,x,y,z){
 return adicionar(new THREE.BoxGeometry(w,h,d),m,x,y,z);
}

function arvore(x,z){
 const g=new THREE.Group();

 const t=new THREE.Mesh(
  new THREE.CylinderGeometry(.25,.4,2.2,9),
  tronco
 );
 t.position.y=1.1;

 const f=new THREE.Mesh(
  new THREE.ConeGeometry(1.6,3.5,9),
  folhas
 );
 f.position.y=3.3;

 t.castShadow=f.castShadow=true;
 g.add(t,f);
 g.position.set(x,0,z);
 cena.add(g);
}

function casa(x,z){
 caixa(7,3.5,6,parede,x,1.75,z);
 caixa(8,1,7,telhado,x,4,z);
 caixa(1.4,2.2,.15,tronco,x,1.1,z-3.08);

 const janela=material(0x7bd7ec);
 caixa(1.2,1.1,.2,janela,x-2,2,z-3.1);
 caixa(1.2,1.1,.2,janela,x+2,2,z-3.1);
}

for(let i=0;i<65;i++){
 const x=(Math.random()-.5)*150;
 const z=(Math.random()-.5)*150;

 if(Math.abs(x)<14&&Math.abs(z)<14)continue;
 arvore(x,z);
}

casa(-23,-18);
casa(24,-24);
casa(-30,25);
casa(31,26);
casa(5,39);
casa(-48,-3);

caixa(9,.08,150,material(0xb7a47a),0,.06,0);

/* PERSONAGENS */

const cores={
 Naruto:0xf07820,
 Sasuke:0x343b58,
 Nami:0x168bc0,
 Zoro:0x278b58,
 Luffy:0xb82c28,
 Goku:0xe66a17,
 Vegeta:0x334d9b,
 Tanjiro:0x253c32,
 Nezuko:0x9c4388,
 Ichigo:0x26252b
};

const cabelos={
 Naruto:0xffd52e,
 Sasuke:0x171a28,
 Nami:0xff9d24,
 Zoro:0x61b95c,
 Luffy:0x252020,
 Goku:0x171313,
 Vegeta:0x15151a,
 Tanjiro:0x4a211b,
 Nezuko:0x211522,
 Ichigo:0xf07826
};

let heroiEscolhido="Naruto";
let jogador=null;
let inimigos=[];

let vida=100;
let pontos=0;
let municao=12;
let reserva=60;

let iniciou=false;
let acabou=false;
let recarregando=false;
let mira=false;
let pulando=false;
let velocidadePulo=0;

let tempoAtaque=0;
let tempoEspecial=0;
let tempoAnimacao=0;

let cameraAngulo=0;
let cameraArrastando=false;
let ultimoX=0;

let joystickAtivo=false;
let joystickId=null;
let deslocamento={x:0,y:0};

const teclas={};
const relogio=new THREE.Clock();

/* MODELO HUMANOIDE */

function criarHumano(cor,cabeloCor,inimigo=false){
 const g=new THREE.Group();

 const pele=material(0xe8b995);
 const roupa=material(cor);
 const escura=material(0x202b43);
 const cabelo=material(cabeloCor);

 function parte(geo,m,x,y,z){
  const o=new THREE.Mesh(geo,m);
  o.position.set(x,y,z);
  o.castShadow=true;
  o.receiveShadow=true;
  g.add(o);
  return o;
 }

 // Tronco
 parte(
  new THREE.CapsuleGeometry(.43,.72,6,12),
  roupa,0,1.35,0
 );

 // Pescoço
 parte(
  new THREE.CylinderGeometry(.12,.14,.22,12),
  pele,0,1.89,0
 );

 // Cabeça
 parte(
  new THREE.SphereGeometry(.32,20,16),
  pele,0,2.15,0
 );

 // Cabelo
 parte(
  new THREE.SphereGeometry(.36,16,12),
  cabelo,0,2.37,-.04
 );

 for(let i=0;i<5;i++){
  const ponta=parte(
   new THREE.ConeGeometry(.12,.42,8),
   cabelo,
   (i-2)*.13,2.53,-.02
  );
  ponta.rotation.z=(i-2)*-.3;
 }

 // Olhos
 const olhos=material(0x171b25);

 parte(new THREE.SphereGeometry(.035,8,8),
 olhos,-.11,2.15,.285);

 parte(new THREE.SphereGeometry(.035,8,8),
 olhos,.11,2.15,.285);

 const pernas=[];
 const bracos=[];

 // Pernas
 for(const lado of [-1,1]){
  const perna=new THREE.Group();
  perna.position.set(lado*.21,.96,0);

  const p=new THREE.Mesh(
   new THREE.CapsuleGeometry(.15,.58,5,9),
   escura
  );
  p.position.y=-.34;
  p.castShadow=true;
  perna.add(p);

  const pe=new THREE.Mesh(
   new THREE.BoxGeometry(.27,.15,.4),
   escura
  );
  pe.position.set(0,-.68,.1);
  perna.add(pe);

  g.add(perna);
  pernas.push(perna);
 }

 // Braços
 for(const lado of [-1,1]){
  const braco=new THREE.Group();
  braco.position.set(lado*.48,1.65,0);

  const b=new THREE.Mesh(
   new THREE.CapsuleGeometry(.13,.57,5,9),
   roupa
  );
  b.position.y=-.31;
  b.castShadow=true;
  braco.add(b);

  const mao=new THREE.Mesh(
   new THREE.SphereGeometry(.13,12,10),
   pele
  );
  mao.position.set(0,-.65,.02);
  braco.add(mao);

  g.add(braco);
  bracos.push(braco);
 }

 // Aura de energia
 const aura=new THREE.Mesh(
  new THREE.SphereGeometry(.8,14,12),
  new THREE.MeshBasicMaterial({
   color:cor,transparent:true,opacity:.045
  })
 );
 aura.position.y=1.3;
 g.add(aura);

 g.userData={pernas,bracos,aura};
 cena.add(g);
 return g;
}

function criarInimigo(x,z){
 const g=criarHumano(0x9e3448,0x25202c,true);
 g.position.set(x,0,z);

 const barra=new THREE.Group();

 const fundo=new THREE.Mesh(
  new THREE.PlaneGeometry(1.2,.12),
  material(0x333333)
 );

 const frente=new THREE.Mesh(
  new THREE.PlaneGeometry(1.15,.09),
  material(0x38e35c)
 );

 frente.position.z=.01;
 barra.add(fundo,frente);
 barra.position.y=2.9;
 g.add(barra);

 return {
  obj:g,
  vida:100,
  vivo:true,
  vel:2.1,
  ataque:0,
  barra:frente,
  anim:Math.random()*5
 };
}

/* HUD */

function atualizarHUD(){
 $("barraVida").style.width=Math.max(0,vida)+"%";
 $("pontos").textContent="Pontos: "+pontos;

 $("inimigosTexto").textContent=
 "Inimigos: "+inimigos.filter(e=>e.vivo).length;

 $("municao").textContent=municao+" / "+reserva;
}

let avisoTimer;

function aviso(texto){
 const a=$("aviso");
 a.textContent=texto;
 a.style.display="block";
 clearTimeout(avisoTimer);

 avisoTimer=setTimeout(()=>{
  a.style.display="none";
 },1400);
}

/* FINAL DO JOGO */

function mensagemFim(vitoria){
 acabou=true;

 $("mensagem").style.display="flex";
 $("controles").style.display="none";
 $("hud").style.display="none";
 $("minimapa").style.display="none";
 $("miraVisual").style.display="none";

 $("caixa").innerHTML=`
  <h1>${vitoria?"🏆 VOCÊ VENCEU!":"FIM DE JOGO"}</h1>
  <p>${vitoria?
   "Você derrotou todos os adversários!":
   "Tente novamente!"}</p>
  <p>Personagem: ${heroiEscolhido}</p>
  <p>Pontuação: <b>${pontos}</b></p>
  <button id="jogar">JOGAR NOVAMENTE</button>
  <button id="voltar" style="
   width:100%;padding:13px;margin-top:9px;
   background:#263f56;color:white;border:0;
   border-radius:10px;font-weight:bold">
   ESCOLHER PERSONAGEM
  </button>
 `;

 $("jogar").onclick=reiniciar;
 $("voltar").onclick=voltarSelecao;
}

function voltarSelecao(){
 iniciou=false;
 acabou=false;

 if(jogador)cena.remove(jogador);
 inimigos.forEach(e=>cena.remove(e.obj));
 inimigos=[];
 jogador=null;

 $("mensagem").style.display="flex";
 $("hud").style.display="none";
 $("controles").style.display="none";
 $("minimapa").style.display="none";

 $("caixa").innerHTML=`
  <h1>NEXUSBLATTER 3D</h1>
  <p class="subtitulo">ANIME BATTLE ROYALE</p>
  <p>ESCOLHA SEU PERSONAGEM</p>
  <div id="listaHerois">
   ${Object.keys(cores).map(nome=>`
    <button class="heroi ${nome===heroiEscolhido?"selecionado":""}"
     data-heroi="${nome}">
     ${nome.toUpperCase()}
     <small>Guerreiro Nexus</small>
    </button>
   `).join("")}
  </div>
  <p id="descricao">Escolha seu herói!</p>
  <button id="jogar">ENTRAR NO JOGO</button>
 `;

 configurarSelecao();
}

function configurarSelecao(){
 document.querySelectorAll(".heroi").forEach(b=>{
  b.onclick=()=>{
   heroiEscolhido=b.dataset.heroi;

   document.querySelectorAll(".heroi").forEach(x=>
    x.classList.remove("selecionado")
   );

   b.classList.add("selecionado");
   $("descricao").textContent=
    heroiEscolhido+" selecionado! Prepare-se!";
  };
 });

 $("jogar").onclick=reiniciar;
}

/* INICIAR JOGO */

function reiniciar(){
 if(jogador)cena.remove(jogador);

 inimigos.forEach(e=>cena.remove(e.obj));
 inimigos=[];

 vida=100;
 pontos=0;
 municao=12;
 reserva=60;

 acabou=false;
 iniciou=true;
 recarregando=false;
 mira=false;
 pulando=false;
 velocidadePulo=0;

 tempoAtaque=0;
 tempoEspecial=0;
 cameraAngulo=0;

 jogador=criarHumano(
  cores[heroiEscolhido],
  cabelos[heroiEscolhido]
 );

 jogador.position.set(0,0,0);

 for(let i=0;i<8;i++){
  const ang=Math.random()*Math.PI*2;
  const dist=23+Math.random()*30;

  inimigos.push(
   criarInimigo(
    Math.cos(ang)*dist,
    Math.sin(ang)*dist
   )
  );
 }

 $("mensagem").style.display="none";
 $("hud").style.display="block";
 $("controles").style.display="flex";
 $("minimapa").style.display="block";
 $("miraVisual").style.display="none";

 $("ajuda").textContent="Derrote todos os adversários!";
 $("btnMira").textContent="MIRA";

 deslocamento.x=0;
 deslocamento.y=0;
 $("pino").style.left="34px";
 $("pino").style.top="34px";

 atualizarHUD();
}

configurarSelecao();

/* DISPARO DE ENERGIA FANTÁSTICA */

function atacar(){
 if(!iniciou||acabou||recarregando)return;

 if(performance.now()-tempoAtaque<350)return;

 if(municao<=0){
  $("ajuda").textContent="Sem energia! Recarregue.";
  return;
 }

 tempoAtaque=performance.now();
 municao--;

 const origem=jogador.position.clone();
 origem.y+=1.5;

 const direcao=new THREE.Vector3(
  Math.sin(cameraAngulo),0,
  Math.cos(cameraAngulo)
 );

 let alvo=null;
 let menor=28;

 inimigos.forEach(e=>{
  if(!e.vivo)return;

  const delta=e.obj.position.clone().sub(origem);
  const distancia=delta.length();

  delta.y=0;
  delta.normalize();

  const alinhamento=delta.dot(direcao);

  if(alinhamento>.93&&distancia<menor){
   menor=distancia;
   alvo=e;
  }
 });

 const fim=origem.clone().addScaledVector(
  direcao,alvo?menor:20
 );

 const geometria=new THREE.BufferGeometry()
  .setFromPoints([origem,fim]);

 const raio=new THREE.Line(
  geometria,
  new THREE.LineBasicMaterial({
   color:cores[heroiEscolhido]
  })
 );

 cena.add(raio);

 setTimeout(()=>{
  cena.remove(raio);
  geometria.dispose();
 },130);

 if(alvo){
  alvo.vida-=34;
  pontos+=10;

  alvo.barra.scale.x=Math.max(0,alvo.vida/100);

  if(alvo.vida<=0){
   alvo.vivo=false;
   alvo.obj.visible=false;
   pontos+=90;
   aviso("ADVERSÁRIO DERROTADO!");
  }else{
   aviso("ACERTOU!");
  }
 }

 atualizarHUD();

 if(inimigos.every(e=>!e.vivo)){
  mensagemFim(true);
 }
}

/* RECARGA */

function recarregar(){
 if(!iniciou||acabou||recarregando)return;
 if(municao===12||reserva<=0)return;

 recarregando=true;
 $("ajuda").textContent="Recarregando energia...";

 setTimeout(()=>{
  if(acabou)return;

  const quantidade=Math.min(12-municao,reserva);

  municao+=quantidade;
  reserva-=quantidade;
  recarregando=false;

  atualizarHUD();
  $("ajuda").textContent="Energia recarregada!";
 },1300);
}

/* PODER ESPECIAL */

function especial(){
 if(!iniciou||acabou)return;

 if(performance.now()-tempoEspecial<4500){
  aviso("PODER RECARREGANDO!");
  return;
 }

 tempoEspecial=performance.now();

 const cor=cores[heroiEscolhido];

 const esfera=new THREE.Mesh(
  new THREE.SphereGeometry(9,24,16),
  new THREE.MeshBasicMaterial({
   color:cor,transparent:true,opacity:.2
  })
 );

 esfera.position.copy(jogador.position);
 esfera.position.y=1;
 cena.add(esfera);

 setTimeout(()=>cena.remove(esfera),400);

 inimigos.forEach(e=>{
  if(!e.vivo)return;

  if(jogador.position.distanceTo(e.obj.position)<9){
   e.vida-=65;
   pontos+=20;

   e.barra.scale.x=Math.max(0,e.vida/100);

   if(e.vida<=0){
    e.vivo=false;
    e.obj.visible=false;
    pontos+=80;
   }
  }
 });

 atualizarHUD();
 aviso("PODER DE "+heroiEscolhido.toUpperCase()+"!");

 if(inimigos.every(e=>!e.vivo)){
  mensagemFim(true);
 }
}

/* PULO E MIRA */

function pular(){
 if(!iniciou||acabou||pulando)return;

 pulando=true;
 velocidadePulo=7;
}

function alternarMira(){
 if(!iniciou||acabou)return;

 mira=!mira;
 camera.fov=mira?48:65;
 camera.updateProjectionMatrix();

 $("miraVisual").style.display=mira?"block":"none";
 $("btnMira").textContent=mira?"SAIR MIRA":"MIRA";
}

});

$("btnEspecial").addEventListener("pointerdown",e=>{
 e.preventDefault();especial();
});

$("btnPulo").addEventListener("pointerdown",e=>{

});

$("btnRecarga").addEventListener("pointerdown",e=>{
 e.preventDefault();recarregar();
});

$("btnMira").addEventListener("pointerdown",e=>{
 e.preventDefault();alternarMira();
});

$("jogar").onclick=reiniciar;

/* TECLADO */

document.addEventListener("keydown",e=>{

 if(e.key===" "){
  e.preventDefault();pular();
 }

 if(e.key.toLowerCase()==="j")atacar();
 if(e.key.toLowerCase()==="k")especial();
 if(e.key.toLowerCase()==="r")recarregar();
 if(e.key.toLowerCase()==="m")alternarMira();
});

document.addEventListener("keyup",e=>{
 teclas[e.key.toLowerCase()]=false;
});

// Tiro à distância na direção da câmera
function atacar(){
 if(!iniciou||acabou||performance.now()-tempoAtaque<450)return;
 tempoAtaque=performance.now();

 const origem=jogador.position.clone();
 origem.y+=1.5;
 const direcao=new THREE.Vector3(
  Math.sin(cameraAngulo),0,Math.cos(cameraAngulo)
 );
 let alvo=null,menor=28;

 inimigos.forEach(e=>{
  if(!e.vivo)return;
  const delta=e.obj.position.clone().sub(origem);
  const distancia=delta.length();
  delta.y=0;delta.normalize();
  const alinhamento=delta.dot(direcao);
  if(alinhamento>.91&&distancia<menor){
   menor=distancia;alvo=e;
  }
 });

 const final=origem.clone().addScaledVector(direcao,alvo?menor:20);
 const linha=new THREE.BufferGeometry().setFromPoints([origem,final]);
 const raio=new THREE.Line(
  linha,new THREE.LineBasicMaterial({color:herois[heroiEscolhido].poder})
 );
 cena.add(raio);
 setTimeout(()=>{cena.remove(raio);linha.dispose();},110);

 if(alvo){
  alvo.vida-=34;pontos+=10;
  if(alvo.vida<=0){
   alvo.vivo=false;alvo.obj.visible=false;
   pontos+=90;aviso("Adversário derrotado!");
  }else aviso("ACERTOU!");
 }
 atualizarHUD();
 if(inimigos.every(e=>!e.vivo))mostrarFim(true);
}

const joystick=document.getElementById("joystick");
const pino=document.getElementById("pino");

joystick.addEventListener("pointerdown",e=>{
 e.preventDefault();joystickAtivo=true;joystickId=e.pointerId;
 joystick.setPointerCapture(e.pointerId);moverPino(e);
});
joystick.addEventListener("pointermove",e=>{
 if(joystickAtivo&&e.pointerId===joystickId)moverPino(e);
});

function soltarJoystick(){
 joystickAtivo=false;deslocamento.x=0;deslocamento.y=0;
 pino.style.left="35px";pino.style.top="35px";
}
joystick.addEventListener("pointerup",soltarJoystick);
joystick.addEventListener("pointercancel",soltarJoystick);

function moverPino(e){
 const r=joystick.getBoundingClientRect();
 let x=e.clientX-(r.left+r.width/2);
 let y=e.clientY-(r.top+r.height/2);
 const limite=35,d=Math.hypot(x,y);
 if(d>limite){x=x/d*limite;y=y/d*limite;}
 deslocamento.x=x/limite;deslocamento.y=y/limite;
 pino.style.left=(35+x)+"px";
 pino.style.top=(35+y)+"px";
}

// Câmera: arrastar o lado direito da tela
renderer.domElement.addEventListener("pointerdown",e=>{
 if(e.clientX>innerWidth*.35){
  cameraArrastando=true;ultimoX=e.clientX;
 }
});
renderer.domElement.addEventListener("pointermove",e=>{
 if(cameraArrastando){
  cameraAngulo-=(e.clientX-ultimoX)*.006;
  ultimoX=e.clientX;
 }
});
function pararCamera(){cameraArrastando=false;}
renderer.domElement.addEventListener("pointerup",pararCamera);
renderer.domElement.addEventListener("pointercancel",pararCamera);

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const canvas=document.querySelector('#world'),scene=new THREE.Scene();

[[-28,-28,0xd5b783,1.1],[29,-32,0xd6a1a1,1.15],[-42,30,0xd9dfd9,1],[42,33,0xd5ad79,1.1],[8,52,0xa9bfd0,.9],[-58,-5,0xd8c58f,.95],[62,-48,0xd0a16e,1.1]].forEach(v=>house(...v));
function tree(x,z,s=1){const g=new THREE.Group();scene.add(g);g.position.set(x,0,z);g.scale.setScalar(s);addMesh(new THREE.CylinderGeometry(.28,.48,3.5,9),bark,0,1.75,0,g);addMesh(new THREE.SphereGeometry(2.25,14,12),leaf,0,4.1,0,g);addMesh(new THREE.SphereGeometry(1.55,12,10),material(0x318344),1.1,4.55,.15,g)}
for(let i=0;i<95;i++){let x=(Math.random()-.5)*240,z=(Math.random()-.5)*240;if(Math.abs(x)<14||Math.abs(z)<14)continue;tree(x,z,.7+Math.random()*.65)}

const roster=[

];

function fighter(data){
 const g=new THREE.Group(),skin=material(0xe9b895),hair=material(data.hair),shirt=material(data.cloth),pants=material(data.accent),boot=material(0x202532),white=material(0xf4e9dc),eye=material(0x202b3d);

document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-panel]').forEach(x=>x.classList.remove('active'));b.classList.add('active');modal(b.dataset.panel,panels[b.dataset.panel]||'<p>Em preparação.</p>')});
function spawn(){enemies.forEach(e=>scene.remove(e.obj));enemies.length=0;for(let i=0;i<8;i++){const obj=fighter(roster[(i+2)%roster.length]);const a=i*Math.PI/4,dist=27+(i%3)*8;obj.position.set(Math.sin(a)*dist,0,Math.cos(a)*dist);scene.add(obj);enemies.push({obj,hp:3,alive:true,speed:1.7+i*.1,next:0})}}
function hud(){document.querySelector('#healthfill').style.width=health+'%';document.querySelector('#healthtext').textContent=Math.ceil(health)+' / 100';document.querySelector('#score').textContent='Pontos: '+score;document.querySelector('#enemyCount').textContent='Adversários: '+enemies.filter(e=>e.alive).length}
function endGame(win){ended=true;game=false;document.querySelector('#gamecontrols').style.display='none';document.querySelector('#cameraHint').style.display='none';document.querySelector('#gamehud').style.display='none';document.querySelector('#bottomnav').style.display='flex';document.querySelector('#leftmenu').style.display='flex';document.querySelector('#rightpanel').style.display='block';document.querySelector('#brand').style.display='block';modal(win?'VITÓRIA!':'FIM DE JOGO',`<p>${win?'Você venceu a arena Nexus!':'Sua energia acabou. Tente novamente!'}</p><p>Pontuação: ${score}</p><button class="action" id="again">JOGAR NOVAMENTE</button>`);document.querySelector('#again').onclick=()=>{document.querySelector('#modal').style.display='none';startGame()}}
function startGame(){score=0;health=100;ended=false;game=true;yaw=0;sx=sy=0;player.position.set(0,0,0);spawn();shots.forEach(s=>scene.remove(s.obj));shots=[];document.querySelector('#modal').style.display='none';document.querySelector('#gamehud').style.display='flex';document.querySelector('#gamecontrols').style.display='flex';document.querySelector('#cameraHint').style.display='block';document.querySelector('#bottomnav').style.display='none';document.querySelector('#leftmenu').style.display='none';document.querySelector('#rightpanel').style.display='none';document.querySelector('#brand').style.display='none';hud()}
document.querySelector('#start').onclick=startGame;
function shoot(power=false){if(!game||ended)return;const now=performance.now();if(power&&now-lastPower<4500){toast('Poder recarregando');return}if(!power&&now-lastShot<260)return;if(power)lastPower=now;else lastShot=now;let target=null,nearest=power?36:28;for(const e of enemies){if(!e.alive)continue;const d=player.position.distanceTo(e.obj.position);if(d<nearest){nearest=d;target=e}}if(!target){toast('Nenhum adversário por perto');return}const orb=addMesh(new THREE.SphereGeometry(power?.42:.23,12,10),material(power?0xb46bff:0xffdf57,.25,{emissive:power?0x792dff:0xff8a00,emissiveIntensity:1.7}),player.position.x,player.position.y+1.6,player.position.z);shots.push({obj:orb,target,speed:power?32:27,damage:power?3:1})}

const stick=document.querySelector('#stick'),knob=document.querySelector('#knob');let stickId=null;
function moveStick(e){const r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=Math.hypot(dx,dy),lim=35,x=m>lim?dx/m*lim:dx,y=m>lim?dy/m*lim:dy;sx=x/lim;sy=y/lim;knob.style.transform=`translate(${x}px,${y}px)`}
stick.onpointerdown=e=>{stickId=e.pointerId;stick.setPointerCapture(stickId);moveStick(e)};stick.onpointermove=e=>{if(e.pointerId===stickId)mo
$("jogar").onclick=reiniciar;

const joystick=$("joystick");
const bola=$("bola");
let toqueJoystick=null;

function moverJoystick(e){
const r=joystick.getBoundingClientRect();

let dx=e.clientX-(r.left+r.width/2);
let dy=e.clientY-(r.top+r.height/2);

const max=35;
const d=Math.hypot(dx,dy);

if(d>max){
dx=dx/d*max;
dy=dy/d*max;
}

joystickX=dx/max;
joystickY=dy/max;

bola.style.transform=`translate(${dx}px,${dy}px)`;
}

joystick.addEventListener("pointerdown",e=>{
e.preventDefault();
toqueJoystick=e.pointerId;
joystick.setPointerCapture(e.pointerId);
moverJoystick(e);
});

joystick.addEventListener("pointermove",e=>{
if(e.pointerId===toqueJoystick)moverJoystick(e);
});

function soltarJoystick(){
toqueJoystick=null;
joystickX=0;
joystickY=0;
bola.style.transform="translate(0,0)";
}

joystick.addEventListener("pointerup",soltarJoystick);
joystick.addEventListener("pointercancel",soltarJoystick);

let ultimaX=0;

renderer.domElement.addEventListener("pointerup",()=>{
 toqueCamera=null;
});

});
